-- Conky widget: CPU / RAM / GPU / Disk / Network
-- Instalare: vezi README.md
conky.config = {
    alignment = 'top_right',
    gap_x = 30,
    gap_y = 50,
    minimum_width = 300, minimum_height = 640,
    maximum_width = 300,

    update_interval = 1,
    double_buffer = true,
    background = false,

    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 0,          -- fundal transparent (rings desenează propriul panou)
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    use_xft = true,
    font = 'DejaVu Sans:size=9',
    default_color = 'E6E6E6',
    color1 = '4FC3F7',                  -- accent
    color2 = '9AA0A6',                  -- text secundar
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,

    cpu_avg_samples = 2,
    net_avg_samples = 2,
    no_buffers = true,
    text_buffer_size = 2048,

    -- !!! Schimbă 'eth0' / 'wlp2s0' cu interfața ta (rulează: ip -br link)
    template1 = 'enp3s0',

    lua_load = '~/.config/conky/rings.lua',
    lua_draw_hook_pre = 'draw_rings',
}

conky.text = [[
${font DejaVu Sans:bold:size=11}${color1}${nodename}${font}${color}${alignr}${color2}${uptime_short}
${color2}${kernel}
${voffset 6}
# ---- CPU (inel desenat la y~120) ----
${voffset 110}${goto 130}${font DejaVu Sans:bold:size=10}CPU${font}  ${color1}${cpu cpu0}%${color}
${goto 130}${color2}Temp: ${color}${hwmon 1 temp 1}°C
${goto 130}${color2}Freq: ${color}${freq_g 1} GHz
${cpugraph cpu0 30,280 4FC3F7 4FC3F7}
${color2}${top name 1}${alignr}${top cpu 1}%
${color2}${top name 2}${alignr}${top cpu 2}%
${color2}${top name 3}${alignr}${top cpu 3}%

# ---- RAM ----
${font DejaVu Sans:bold:size=10}RAM${font}  ${color1}${memperc}%${color}${alignr}${mem} / ${memmax}
${memgraph 24,280 4FC3F7 4FC3F7}
${color2}${top_mem name 1}${alignr}${top_mem mem_res 1}
${color2}${top_mem name 2}${alignr}${top_mem mem_res 2}
${color2}Swap: ${color}${swap} / ${swapmax}

# ---- GPU ----
${font DejaVu Sans:bold:size=10}GPU${font}  ${color1}${execi 2 ~/.config/conky/gpu.sh name}${color}
${color2}Utilizare: ${color}${execi 2 ~/.config/conky/gpu.sh util}%${alignr}${color2}Temp: ${color}${execi 2 ~/.config/conky/gpu.sh temp}°C
${color2}VRAM: ${color}${execi 2 ~/.config/conky/gpu.sh mem}

# ---- Disk ----
${font DejaVu Sans:bold:size=10}Disk${font}
${color2}/ ${color}${fs_used /} / ${fs_size /}${alignr}${fs_used_perc /}%
${fs_bar 6,280 /}
${color2}/home ${color}${fs_used /home} / ${fs_size /home}${alignr}${fs_used_perc /home}%
${fs_bar 6,280 /home}
${color2}Citire: ${color}${diskio_read}${alignr}${color2}Scriere: ${color}${diskio_write}

# ---- Rețea ----
${font DejaVu Sans:bold:size=10}Rețea${font}  ${color2}${addr ${template1}}
${color2}↓ ${color}${downspeed ${template1}}${alignr}${color2}Total: ${color}${totaldown ${template1}}
${downspeedgraph ${template1} 24,280 4FC3F7 4FC3F7}
${color2}↑ ${color}${upspeed ${template1}}${alignr}${color2}Total: ${color}${totalup ${template1}}
${upspeedgraph ${template1} 24,280 4FC3F7 4FC3F7}
]]
